<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0f14" />
  <title>VesselX – No Connection</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      min-height: 100dvh;
      background-color: #0d0f14;
      background-image:
        radial-gradient(ellipse 80% 50% at 20% -10%, rgba(88,101,242,0.15) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 100%, rgba(235,69,158,0.1) 0%, transparent 60%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Noto Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #e2e5ea;
      -webkit-font-smoothing: antialiased;
      text-align: center;
      padding: 32px 24px;
    }
    .logo {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #5865f2, #eb459e);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 28px;
      font-size: 36px;
      font-weight: 900;
      color: white;
      letter-spacing: -2px;
      box-shadow: 0 8px 40px rgba(88,101,242,0.35);
    }
    h1 {
      font-size: 26px;
      font-weight: 800;
      margin: 0 0 10px;
      background: linear-gradient(135deg, #e2e5ea, #b9bcc3);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    p {
      color: rgba(255,255,255,0.45);
      font-size: 15px;
      line-height: 1.6;
      margin: 0 0 36px;
      max-width: 280px;
    }
    .retry-btn {
      background: linear-gradient(135deg, #5865f2, #4752c4);
      color: white;
      border: none;
      padding: 14px 36px;
      border-radius: 50px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 4px 20px rgba(88,101,242,0.4);
      letter-spacing: 0.3px;
    }
    .retry-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 28px rgba(88,101,242,0.5); }
    .retry-btn:active { transform: scale(0.97); }
    .signal {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 4px;
      margin-bottom: 28px;
      height: 36px;
    }
    .bar {
      width: 8px;
      border-radius: 4px;
      background: rgba(88,101,242,0.3);
      animation: pulse 1.4s ease-in-out infinite;
    }
    .bar:nth-child(1) { height: 12px; animation-delay: 0s; }
    .bar:nth-child(2) { height: 20px; animation-delay: 0.15s; }
    .bar:nth-child(3) { height: 28px; animation-delay: 0.3s; }
    .bar:nth-child(4) { height: 36px; animation-delay: 0.45s; }
    @keyframes pulse {
      0%, 100% { background: rgba(88,101,242,0.25); }
      50% { background: rgba(88,101,242,0.7); }
    }
  </style>
</head>
<body>
  <div class="logo">V</div>
  <div class="signal">
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
  </div>
  <h1>You're offline</h1>
  <p>VesselX needs a connection to keep you in the loop. Check your internet and try again.</p>
  <button class="retry-btn" onclick="window.location.reload()">Try Again</button>
  <script>
    window.addEventListener('online', () => window.location.reload());
  </script>
</body>
</html>
