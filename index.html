    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap');

      #vx-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: #0d0f14;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        transition: opacity 0.35s ease, visibility 0.35s ease;
      }
      #vx-splash.hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #vx-splash svg {
        animation: vx-pulse 1.6s ease-in-out infinite;
        filter: drop-shadow(0 0 24px rgba(88,101,242,0.5));
      }
      #vx-splash-name {
        font-family: 'Arial Black', Arial, sans-serif;
        font-weight: 900;
        font-size: 26px;
        color: #ffffff;
        letter-spacing: 1px;
      }
      #vx-splash-dots {
        display: flex;
        gap: 6px;
      }
      #vx-splash-dots span {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #5865f2;
        animation: vx-bounce 1.2s ease-in-out infinite;
      }
      #vx-splash-dots span:nth-child(2) { animation-delay: 0.15s; }
      #vx-splash-dots span:nth-child(3) { animation-delay: 0.3s; }
      @keyframes vx-pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.06); }
      }
      @keyframes vx-bounce {
        0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
        40% { transform: translateY(-6px); opacity: 1; }
      }
    </style>
  </head>

      </svg>
      <div id="vx-splash-name">VesselX</div>
      <div id="vx-splash-dots"><span></span><span></span><span></span></div>
    </div>

    <script type="module" src="/src/main.jsx"></script>
    <script>
      (function() {
        var splash = document.getElementById('vx-splash');
        function hideSplash() {
          if (splash) {
            splash.classList.add('hide');
            setTimeout(function() { if (splash) splash.remove(); }, 400);
          }
        }
        window.__hideSplash = hideSplash;
        setTimeout(hideSplash, 6000);
      })();
    </script>
