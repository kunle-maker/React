    <title>VesselX</title>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
           .then(function(reg) {
             // Check for updates every 30 minutes
             setInterval(() => {
               reg.update();
             }, 1000 * 60 * 30);

             reg.addEventListener('updatefound', function() {
               var nw = reg.installing;
               if (!nw) return;
               nw.addEventListener('statechange', function() {
                 if (nw.state === 'installed' && navigator.serviceWorker.controller) {
                   nw.postMessage({ type: 'SKIP_WAITING' });
                 }
               });
             });
           });          navigator.serviceWorker.addEventListener('controllerchange', function() {
            window.location.reload();
          });
        });
      }
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

      * { margin: 0; padding: 0; box-sizing: border-box; }

      #vx-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: #0d0f14;
        background-image:
          radial-gradient(ellipse 90% 60% at 10% 0%, rgba(88, 101, 242, 0.18) 0%, transparent 55%),
          radial-gradient(ellipse 70% 50% at 90% 110%, rgba(16, 185, 129, 0.12) 0%, transparent 55%),
          radial-gradient(ellipse 50% 40% at 50% 50%, rgba(139, 92, 246, 0.06) 0%, transparent 70%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0;
        transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      }
      #vx-splash.hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      /* Icon ring wrapper */
      .vx-icon-wrap {
        position: relative;
        width: 100px;
        height: 100px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 28px;
        animation: vx-enter 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }
      /* Outer spinning ring */
      .vx-ring {
        position: absolute;
        inset: -10px;
        border-radius: 50%;
        border: 2.5px solid transparent;
        border-top-color: #8b5cf6;
        border-right-color: rgba(139, 92, 246, 0.3);
        animation: vx-spin 1.1s linear infinite;
      }
      /* Second inner ring */
      .vx-ring-2 {
        position: absolute;
        inset: -4px;
        border-radius: 50%;
        border: 1.5px solid transparent;
        border-bottom-color: #10b981;
        border-left-color: rgba(16, 185, 129, 0.2);
        animation: vx-spin-rev 1.7s linear infinite;
      }
      /* Glow behind the icon */
      .vx-glow {
        position: absolute;
        inset: 0;
        border-radius: 26px;
        background: rgba(88, 101, 242, 0.25);
        filter: blur(16px);
        animation: vx-glow-pulse 2s ease-in-out infinite;
      }
      #vx-splash svg {
        position: relative;
        z-index: 1;
        border-radius: 22px;
        filter: drop-shadow(0 4px 16px rgba(88, 101, 242, 0.4));
      }

      /* Text block */
      .vx-text-block {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        animation: vx-slide-up 0.5s 0.25s cubic-bezier(0.34, 1.2, 0.64, 1) both;
      }
      #vx-splash-name {
        font-family: 'Inter', sans-serif;
        font-weight: 800;
        font-size: 30px;
        letter-spacing: -0.8px;
        background: linear-gradient(135deg, #ffffff 0%, #c4b5fd 60%, #a78bfa 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      #vx-splash-tagline {
        font-family: 'Inter', sans-serif;
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.6px;
        color: rgba(255,255,255,0.35);
        text-transform: uppercase;
      }

      /* Status dots at the bottom of text */
      .vx-status {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 32px;
        animation: vx-fade-in 0.4s 0.5s ease both;
      }
      .vx-status-dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: rgba(139, 92, 246, 0.6);
        animation: vx-status-blink 1.4s ease-in-out infinite;
      }
      .vx-status-dot:nth-child(2) { animation-delay: 0.2s; }
      .vx-status-dot:nth-child(3) { animation-delay: 0.4s; }

      /* Footer */
      .vx-splash-footer {
        position: absolute;
        bottom: 28px;
        left: 0;
        right: 0;
        text-align: center;
        font-family: 'Inter', sans-serif;
      }
      .vx-powered {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: rgba(255,255,255,0.03);
        backdrop-filter: blur(8px);
        padding: 6px 14px;
        border-radius: 40px;
        border: 1px solid rgba(255,255,255,0.06);
        font-size: 10px;
        font-weight: 500;
        color: rgba(255,255,255,0.4);
        text-decoration: none;
        transition: all 0.2s;
      }
      .vx-powered:hover {
        background: rgba(139, 92, 246, 0.1);
        border-color: rgba(139, 92, 246, 0.3);
        color: #c4b5fd;
      }
      .vx-powered span:first-child {
        background: rgba(139, 92, 246, 0.2);
        padding: 2px 8px;
        border-radius: 30px;
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.5px;
        color: #c4b5fd;
      }

      @keyframes vx-spin { to { transform: rotate(360deg); } }
      @keyframes vx-spin-rev { to { transform: rotate(-360deg); } }
      @keyframes vx-glow-pulse {
        0%, 100% { opacity: 0.6; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.15); }
      }
      @keyframes vx-enter {
        from { opacity: 0; transform: scale(0.7); }
        to   { opacity: 1; transform: scale(1); }
      }
      @keyframes vx-slide-up {
        from { opacity: 0; transform: translateY(14px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes vx-fade-in {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      @keyframes vx-status-blink {
        0%, 100% { opacity: 0.3; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.3); background: #8b5cf6; }
      }
    </style>
  </head>
  <body>
    <div id="vx-splash">
      <div class="vx-icon-wrap">
        <div class="vx-glow"></div>
        <div class="vx-ring"></div>
        <div class="vx-ring-2"></div>
        <svg width="80" height="80" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="100" height="100" rx="22" fill="#5865f2"/>
          <text x="50" y="72" font-family="Arial Black, Arial" font-weight="900" font-size="62" text-anchor="middle" fill="white">V</text>
        </svg>
      </div>
      <div class="vx-text-block">
        <div id="vx-splash-name">VesselX</div>
        <div id="vx-splash-tagline">Carrying connections forward</div>
      </div>
      <div class="vx-status">
        <div class="vx-status-dot"></div>
        <div class="vx-status-dot"></div>
        <div class="vx-status-dot"></div>
      </div>
      <div class="vx-splash-footer">
        <a href="https://dash.domain.digitalplat.org/signup?ref=konuimkeoF" target="_blank" rel="noopener noreferrer" class="vx-powered">
          <span>DigitalPlat</span> Free domain by DigitalPlat
        </a>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      (function() {
        var splash = document.getElementById('vx-splash');
        var splashHidden = false;
        var startTime = Date.now();
        var minDisplayTime = 800;

        function hideSplash() {
          if (splashHidden) return;
          splashHidden = true;
          if (splash) {
            splash.classList.add('hide');
            setTimeout(function() {
              if (splash && splash.parentNode) splash.remove();
            }, 550);
          }
        }

        function onReactReady() {
          if (splashHidden) return;
          var elapsed = Date.now() - startTime;
          var wait = Math.max(0, minDisplayTime - elapsed);
          setTimeout(hideSplash, wait);
        }

        window.__hideSplash = onReactReady;

        setTimeout(function() { hideSplash(); }, 10000);
      })();
    </script>
  </body>
</html>
